# Tag vX.Y.Z (matching src-tauri/tauri.conf.json "version") -> universal .dmg on a GitHub release -> cask bumped in
# grepbrew/homebrew-tap, so `brew install --cask grepbrew/tap/hose` / `brew upgrade` pick it up.
# Needs repo secret TAP_DEPLOY_KEY: private half of a read-write deploy key on grepbrew/homebrew-tap.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    # grepbrew gets no Apple Silicon hosted runners (macos-14/15 jobs are never acquired, 2026-10-29 probe);
    # Intel builds the universal DMG just as well.
    # ponytail: macos-15-intel is GitHub's last Intel image; when it retires, try macos-latest again or self-host.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      # The DMG name comes from tauri.conf.json, the cask from the tag: fail in seconds if they differ.
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./src-tauri/tauri.conf.json').version")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signed: Tauri's APPLE_CERTIFICATE import only accepts Apple-issued certs, so the self-signed
          # "Hose Local Signing" (local builds) can't be used here. Keys aren't in the Keychain, so a signature that
          # changes per update costs nothing.
          # ponytail: not notarized (no Apple Developer account). With one, set APPLE_CERTIFICATE(+_PASSWORD),
          # APPLE_SIGNING_IDENTITY (Developer ID), APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID and drop the quarantine
          # postflight from the cask below.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hose ${{ github.ref_name }}
          releaseBody: "Install: `brew trust --cask grepbrew/tap/hose && brew install --cask grepbrew/tap/hose`. Update: `brew upgrade --cask hose`"
          args: --target universal-apple-darwin

      - name: Bump cask in tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          DMG="Hose_${VERSION}_universal.dmg"
          SHA=$(shasum -a 256 "src-tauri/target/universal-apple-darwin/release/bundle/dmg/$DMG" | cut -d' ' -f1)
          echo "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key" && chmod 600 "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:grepbrew/homebrew-tap.git tap
          mkdir -p tap/Casks
          cat > tap/Casks/hose.rb <<EOF
          cask "hose" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/grepbrew/Hose/releases/download/v#{version}/Hose_#{version}_universal.dmg"
            name "Hose"
            desc "Deploy Hugging Face chat models on RunPod GPUs and watch the cost"
            homepage "https://github.com/grepbrew/Hose"

            depends_on macos: :monterey

            app "Hose.app"

            # Not notarized yet: clear the quarantine flag so macOS opens it without the "damaged" warning.
            # Homebrew 7 deprecates postflight blocks; install steps take {{appdir}} as a token.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/Hose.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.grepbrew.hose",
              "~/Library/Caches/com.grepbrew.hose",
              "~/Library/WebKit/com.grepbrew.hose",
            ]

            caveats <<~EOS
              Hose is not notarized by Apple yet. If macOS still refuses to open it, go to
              System Settings > Privacy & Security and click "Open Anyway" next to Hose.
            EOS
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hose.rb
          git commit -m "hose ${VERSION}"
          git push
